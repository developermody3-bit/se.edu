name: Validate generated dates

on:
  push:
    branches: ["main"]
    paths:
      - "mox/**/*.html"
      - "mox/*.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate uploadDate and datePublished
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("mox")
          pattern_upload = re.compile(r'"uploadDate"\s*:\s*"([^"]+)"', re.I)
          pattern_published = re.compile(r'"datePublished"\s*:\s*"([^"]+)"', re.I)

          checked = 0
          for html_file in root.glob("*.html"):
              text = html_file.read_text(encoding="utf-8")
              upload = pattern_upload.search(text)
              published = pattern_published.search(text)
              if upload and published:
                  checked += 1
                  print(f"OK: {html_file.name}")
                  print(f"  uploadDate: {upload.group(1)}")
                  print(f"  datePublished: {published.group(1)}")

          print(f"Checked {checked} HTML file(s).")
          PY
